[project]
name = "ione_qms"
authors = [
    { name = "IONE", email = "317395616@qq.com" }
]
description = "Hospital-wide medical quality management, improvement, analytics, integration, and governed AI for Frappe"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = [
    # Flow's sequential Bench installation can otherwise select versions that
    # violate the exact Frappe develop/manager snapshots. These pins are the
    # resolver-tested intersection of both official applications.
    "aiohttp==3.14.1",
    "Click==8.4.2",
    # 1.83.7 is the highest compatible release permitted by official Flow's
    # current >=1.83.0,<1.83.8 metadata. Proxy-only residual advisories are
    # documented as not affected in security/dependency-vex.md.
    "litellm==1.83.7",
    "oracledb==4.0.2",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=17.0.0-dev,<18.0.0"
flow = ">=0.0.1"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF", "S"]
ignore = [
    "E501",
    "W191",
    "S101",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["ione_qms/tests"]
addopts = "-q"
